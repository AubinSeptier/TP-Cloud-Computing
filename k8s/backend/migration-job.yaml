# This Kubernetes Job is used to run database migrations for the IMC Tracker backend.
apiVersion: batch/v1
kind: Job
metadata:
  name: migration-job
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm-sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    spec:
      containers:
      - name: migration
        image: 192.168.56.101:5000/imc-tracker-backend:latest
        imagePullPolicy: Always
        command: ["sh", "-c"]
        args:
          - |
            echo "Waiting for PostgreSQL..."
            while ! pg_isready -h db -U ${POSTGRES_USER}; do
              sleep 2
            done
            echo "PostgreSQL is ready, running upgrade..."
            flask db upgrade
        env:
          - name: DATABASE_URL
            valueFrom:
              configMapKeyRef:
                name: app-config
                key: DATABASE_URL
          - name: JWT_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: app-secrets
                key: JWT_SECRET_KEY
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: app-secrets
                key: POSTGRES_USER
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: app-secrets
                key: POSTGRES_PASSWORD
          - name: FLASK_APP
            valueFrom:
              configMapKeyRef:
                name: app-config
                key: FLASK_APP
      restartPolicy: Never
  backoffLimit: 4
  