# Docker Compose file for a Flask backend with PostgreSQL and a React frontend
# This file defines the services, networks, and volumes for the application.
version: '3.11'

services:
  db: # PostgreSQL database service
    image: postgres:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      placement:
        constraints: [node.role == manager]

  backend: # Flask backend service
    image: 192.168.56.101:5000/imc-tracker-backend:latest
    depends_on:
      - db
    environment: 
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ACCESS_TOKEN_EXPIRES=${JWT_ACCESS_TOKEN_EXPIRES}
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "
        echo 'Waiting for PostgreSQL...'
        while ! pg_isready -h db -p 5432; do
          sleep 1
        done
        echo 'PostgreSQL is ready!'
        flask db upgrade
        gunicorn --bind 0.0.0.0:5000 'app:create_app()'"

  frontend: # React frontend service
    image: 192.168.56.101:5000/imc-tracker-frontend:latest
    depends_on:
      - backend
    ports:
      - "80:80"
    environment:
      - REACT_APP_API_URL=/api

volumes:
  postgres_data: